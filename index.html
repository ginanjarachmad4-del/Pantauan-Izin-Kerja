<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Izin Kerja Stasiun Tasikmalaya</title>
</head>
<body>

<h2>Form Pantauan Izin Kerja</h2>

<form id="izinForm">
  <input name="no_permit" placeholder="No Permit" required><br>
  <input name="nama_pekerjaan" placeholder="Nama Pekerjaan" required><br>
  <input name="unit_kontraktor" placeholder="Unit / Kontraktor" required><br>

  <label>Jam Mulai</label><br>
  <input type="time" name="jam_mulai" required><br>

  <label>Jam Selesai</label><br>
  <input type="time" name="jam_selesai" required><br>

  <input name="lokasi" placeholder="Lokasi Pekerjaan" required><br>

  <select name="jenis_pekerjaan" required>
    <option value="">Jenis Pekerjaan</option>
    <option>Perawatan</option>
    <option>Perbaikan</option>
    <option>Instalasi</option>
    <option>Pemeriksaan</option>
  </select><br>

  <textarea name="deskripsi" placeholder="Deskripsi Pekerjaan" required></textarea><br>

  <input name="pic" placeholder="PIC / Penanggung Jawab" required><br>
  <input 
  name="whatsapp"
  id="whatsapp"
  placeholder="628xxxxxxxxx"
  required
  pattern="62[0-9]{9,13}"
  inputmode="numeric"
  maxlength="15"
>
<small>Format wajib: 62xxxxxxxxx</small>

  <button type="submit">Kirim</button>
</form>

<script>
  const wa = document.getElementById("whatsapp");

wa.addEventListener("input", () => {
  wa.value = wa.value
    .replace(/[^0-9]/g, "")   // hapus non angka
    .replace(/^0/, "62");     // kalau mulai 0 → jadi 62
});
  document.getElementById("izinForm").addEventListener("submit", function(e){
  e.preventDefault();

  const data = new URLSearchParams(new FormData(this));

  fetch("https://script.google.com/macros/s/AKfycbxLH9-f5XHAvlmsC3wvfHB8kXo19R6z8gaR0e7nUW5CkFGjkevNJFX-dmsyCNAr6l37hg/exec", {
    method: "POST",
    mode: "no-cors",   // 🔥 WAJIB
    body: data
  });

  alert("Laporan dikirim");
  this.reset();
});

</script>
</body>
</html>
